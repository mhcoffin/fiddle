name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build test executables
        run: >-
          cmake --build build-ci --config Release --parallel 3 --target
          ExpressionMapTest
          VersionStoreTest
          GainMathTest
          HarmonicAnalyzerTest
          TransportTest
          ProgramStateReplayTest
          StateRestoreTest
          RealtimeQueueTest

      - name: Run stable tests
        run: ctest --test-dir build-ci -C Release --output-on-failure -L stable

      - name: Confirm documented failures
        run: >-
          ctest --test-dir build-ci -C Release --output-on-failure
          -L known-failure

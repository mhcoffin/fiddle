name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node for UI tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build test executables
        run: >-
          cmake --build build-ci --config Release --parallel 3 --target
          FiddleTests

      - name: Run stable tests
        run: ctest --test-dir build-ci -C Release --output-on-failure --no-tests=error --output-junit stable-tests.xml -L stable

      - name: Confirm documented failures
        run: >-
          ctest --test-dir build-ci -C Release --output-on-failure
          -L known-failure

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build-ci/stable-tests.xml
            build-ci/Testing/Temporary/LastTest.log
            build-ci/Testing/Temporary/LastTestsFailed.log
